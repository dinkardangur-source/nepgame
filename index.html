<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e14">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Himalayan">
  <meta name="screen-orientation" content="landscape">
  <meta name="x5-orientation" content="landscape">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <title>Himalayan Realms</title>
  <meta name="description" content="Isometric Strategy Prototype set in Himalayan kingdoms">
  <meta property="og:title" content="Himalayan Realms">
  <meta property="og:description" content="Isometric Strategy Prototype set in Himalayan kingdoms">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&family=Cinzel:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    html, body, #root {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      background: #0a0e14;
    }
    #app-boot-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: radial-gradient(circle at 50% 38%, #162820 0%, #0a0e14 72%);
      color: #f8fafc;
      font-family: 'Barlow Condensed', system-ui, -apple-system, sans-serif;
      transition: opacity 0.2s ease;
    }
    #app-boot-splash .boot-title {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: #fde047;
      text-transform: uppercase;
    }
    #app-boot-splash .boot-sub {
      font-size: 13px;
      letter-spacing: 0.08em;
      color: #a7f3d0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #app-boot-splash .boot-bar-track {
      width: min(260px, 72vw);
      height: 5px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.18);
      overflow: hidden;
    }
    #app-boot-splash .boot-bar-fill {
      width: 45%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #10b981, #facc15);
      animation: bootSlide 1.1s ease-in-out infinite;
    }
    @keyframes bootSlide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(260%); }
    }
  </style>
</head>
<body>
  <div id="app-boot-splash" aria-label="Loading Himalayan Realms">
    <div class="boot-title">Himalayan Realms</div>
    <div class="boot-bar-track"><div class="boot-bar-fill"></div></div>
    <div id="app-boot-status" class="boot-sub">Loading realm assets...</div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
