name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    paths-ignore:
      - 'android-apk/**'
      - 'apk-version.json'

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK & Install API 36 Tools
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            SDK_ROOT="$HOME/android-sdk"
            mkdir -p "$SDK_ROOT"
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER=""
          for candidate in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/bin/sdkmanager" \
            "$(command -v sdkmanager 2>/dev/null || true)"; do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            echo "Downloading Android command-line tools..."
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-unpack
            rm -rf "$SDK_ROOT/cmdline-tools/latest"
            mv /tmp/cmdline-tools-unpack/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
            rm -rf /tmp/cmdline-tools.zip /tmp/cmdline-tools-unpack
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Dependencies, Version APK & Sync Capacitor
        id: apk_version
        run: |
          npm install --no-audit --no-fund
          node scripts/bump-apk-version.mjs --ci-run "${{ github.run_number }}"
          npm run build
          npx cap sync android

      - name: Build Debug APK
        run: |
          keytool -list -keystore android/app/debug.keystore -storetype PKCS12 -storepass android -alias androiddebugkey >/dev/null
          rm -f android/local.properties
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Package & Overwrite Android APK
        run: |
          node scripts/package-apk.mjs
          mkdir -p /tmp/release-apks
          cp android-apk/*.apk /tmp/release-apks/

      - name: Commit & Push Overwritten APK to Repository
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A android-apk apk-version.json package.json android/app/build.gradle
          if ! git diff --cached --quiet; then
            git commit -m "chore(apk): update Himalayan-Realms v${{ steps.apk_version.outputs.version_name }} (b${{ steps.apk_version.outputs.version_code }}) APK [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push origin "HEAD:${{ github.ref_name }}"
          else
            echo "No APK or version changes to commit."
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HimalayanRealms-debug-apk-v${{ steps.apk_version.outputs.version_name }}-b${{ steps.apk_version.outputs.version_code }}
          path: /tmp/release-apks/*.apk

      - name: Overwrite Rolling Latest GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Himalayan Realms Latest (v${{ steps.apk_version.outputs.version_name }} Build ${{ steps.apk_version.outputs.version_code }})
          body: |
            Automated latest Android APK build (`v${{ steps.apk_version.outputs.version_name }}`, build `${{ steps.apk_version.outputs.version_code }}`) from commit `${{ github.sha }}`.
            Download `Himalayan-Realms-debug.apk` below (automatically overwritten on every push).
          overwrite_files: true
          make_latest: true
          files: /tmp/release-apks/*.apk
