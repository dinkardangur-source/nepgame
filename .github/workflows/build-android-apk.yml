name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 36 & Build Tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Dependencies, Version APK & Sync Capacitor
        id: apk_version
        run: |
          npm install --no-audit --no-fund
          node scripts/bump-apk-version.mjs --ci-run "${{ github.run_number }}"
          npm run build
          npx cap sync android

      - name: Build Debug APK
        run: |
          rm -f android/local.properties
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Package Android APK
        run: |
          mkdir -p android-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk android-apk/Himalayan-Realms-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk "android-apk/Himalayan-Realms-v${{ steps.apk_version.outputs.version_name }}-b${{ steps.apk_version.outputs.version_code }}-debug.apk"

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HimalayanRealms-debug-apk-v${{ steps.apk_version.outputs.version_name }}-b${{ steps.apk_version.outputs.version_code }}
          path: android-apk/*.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk_version.outputs.version_name }}-b${{ steps.apk_version.outputs.version_code }}
          name: Himalayan Realms v${{ steps.apk_version.outputs.version_name }} (Build ${{ steps.apk_version.outputs.version_code }})
          generate_release_notes: true
          files: android-apk/*.apk
